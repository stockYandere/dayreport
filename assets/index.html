<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; connect-src 'none'; img-src 'self' data:; object-src 'none'"><title>사용 흐름</title><link rel="stylesheet" href="style.css"></head><body><div id="app"><header><div><b>수면 기록</b><small id="subtitle" hidden></small><div class="row sleep-switch"><button data-sleep-page="pattern" onclick="sleepPage('pattern')">1 패턴</button><button data-sleep-page="records" onclick="sleepPage('records')">2 기록</button></div></div><div class="row"><button id="reload" aria-label="새로고침">↻</button><button id="settings" aria-label="설정">⚙</button></div></header><main id="content"></main><nav aria-label="하단 탭"><button data-native-page="0" onclick="goDashboard(0)">시간대</button><button data-native-page="1" onclick="goDashboard(1)">모든 앱</button><button data-tab="sleep" onclick="sleepPage('records')">수면 기록</button></nav></div><dialog id="modal"><div id="modalContent"></div></dialog><div id="toast" role="status"></div><script src="logic.js"></script><script src="app.js"></script></body></html>
